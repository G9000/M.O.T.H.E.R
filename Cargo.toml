[package]
name = "mother-workspace"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
name = "mother"
path = "src/lib.rs"

[[bin]]
name = "mother"
path = "src/main.rs"

[dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rmcp = { version = "3.9", features = ["server", "client", "transport-io", "transport-child-process"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
zeroize = "1"
tempfile = "3"
wait-timeout = "0.2"
fs2 = "0.4"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

# Keep this independently hosted package separate in nested checkouts.
[workspace]
