<!doctype html>
<!-- The memory garden: served only by `mother garden explore`, on this machine, with every file embedded in the executable. The valley is Patch's painted valley (MIT code, CC0 art; see LICENCE-NOTES.md). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Memory Garden</title>
    <link rel="icon" href="data:," />
    <style>
      /* The page over the painted valley: smoky frosted glass, white hairlines and a plain modern face, so the
         painting stays the picture. Colour comes only from the kinds' dots. */
      :root {
        color-scheme: dark;
        --glass: rgba(24, 26, 34, 0.38);
        --glass-strong: rgba(22, 24, 32, 0.56);
        --hair: rgba(255, 255, 255, 0.22);
        --hair-soft: rgba(255, 255, 255, 0.12);
        --hover: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --text-2: rgba(255, 255, 255, 0.74);
        --text-3: rgba(255, 255, 255, 0.5);
        --warn: #ffd28a;
        --bad: #ff9aa8;
        --face: 'Segoe UI Variable Text', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        --display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, monospace;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --shade: 0 1px 2px rgba(0, 0, 0, 0.35), 0 0 12px rgba(0, 0, 0, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9db7d4;
        color: var(--text);
        font: 14px/1.5 var(--face);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 1.5px solid rgba(255, 255, 255, 0.9);
        outline-offset: 2px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      [hidden] {
        display: none !important;
      }
      .glass {
        background: var(--glass);
        border: 1px solid var(--hair);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(10, 14, 30, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(22px) saturate(1.5);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
      }
      .ico {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dot {
        width: 8px;
        height: 8px;
        flex: none;
        display: inline-block;
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.35);
      }

      /* ---- the curtain, and the words before you walk --------------------------------------------------------- */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 18px;
        background: linear-gradient(180deg, #8fb0d6 0%, #c9d8e6 55%, #e9dcc6 100%);
        font: 500 14px var(--display);
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 1px 6px rgba(30, 50, 80, 0.35);
        pointer-events: none;
      }
      #loading > span {
        order: 2;
      }
      #loading .sigil {
        order: 1;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #start {
        position: fixed;
        inset: 0;
        display: none;
        place-items: end center;
        padding-bottom: 13vh;
        pointer-events: none;
        user-select: none;
        text-align: center;
        text-shadow: var(--shade);
      }
      .ready:not(.playing) #start {
        display: grid;
      }
      #start b {
        display: inline-block;
        font: 600 15px var(--display);
        padding: 8px 18px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--hair);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        text-shadow: none;
      }
      #start span {
        display: block;
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--text-2);
      }
      #note {
        position: fixed;
        top: 12vh;
        left: 0;
        right: 0;
        text-align: center;
        font: 600 18px var(--display);
        text-shadow: var(--shade);
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #note.on {
        opacity: 1;
        transition: opacity 0.15s;
      }
      #aim {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        display: none;
      }
      .playing #aim {
        display: block;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: calc(50% + 22px);
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        pointer-events: none;
      }
      body:not(.playing) #hint {
        display: none;
      }
      #era {
        position: fixed;
        left: 20px;
        bottom: 20px;
        font: 600 13px var(--display);
        text-shadow: var(--shade);
        pointer-events: none;
      }

      /* ---- the header ---------------------------------------------------------------------------------------- */
      .bar {
        position: fixed;
        z-index: 4;
        top: 0;
        left: 0;
        right: 0;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        pointer-events: none;
      }
      .ready .bar {
        display: flex;
      }
      .bar > * {
        pointer-events: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 14px 6px 8px;
        border-radius: 999px;
        pointer-events: auto;
      }
      .mark {
        width: 18px;
        height: 18px;
        flex: none;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0 22%, rgba(255, 255, 255, 0.55) 23% 40%, transparent 41%), radial-gradient(circle, transparent 58%, rgba(255, 255, 255, 0.8) 60% 66%, transparent 68%);
      }
      .brand h1 {
        margin: 0;
        font: 600 14px var(--display);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .badge {
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
        max-width: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-width 0.4s var(--ease), opacity 0.3s;
      }
      .brand:hover .badge {
        max-width: 220px;
        opacity: 1;
      }
      .spacer {
        flex: 1;
      }
      .find {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 36px;
        height: 36px;
        padding: 0 0 0 10px;
        border-radius: 999px;
        cursor: pointer;
        transition: width 0.35s var(--ease), background 0.2s;
      }
      .find:hover {
        background: var(--glass-strong);
      }
      .find input {
        flex: 1;
        min-width: 0;
        width: 0;
        opacity: 0;
        border: 0;
        background: none;
        outline: none;
        font-size: 14px;
        transition: opacity 0.2s;
      }
      .find input::placeholder {
        color: var(--text-3);
      }
      .find input::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }
      .find kbd {
        display: none;
      }
      .find:focus-within,
      .find:has(input:not(:placeholder-shown)) {
        width: min(300px, 46vw);
        padding: 0 12px 0 11px;
        cursor: text;
        background: var(--glass-strong);
      }
      .find:focus-within input,
      .find:has(input:not(:placeholder-shown)) input {
        opacity: 1;
        width: auto;
      }
      #found {
        position: absolute;
        top: 44px;
        right: 0;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 500;
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--glass-strong);
        border: 1px solid var(--hair-soft);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .btn {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn:hover {
        background: var(--glass-strong);
      }
      kbd {
        font: 11px var(--mono);
        color: var(--text-3);
      }

      /* ---- the beds: a column of dots that opens into the legend ------------------------------------------------- */
      .beds {
        position: fixed;
        z-index: 3;
        top: 68px;
        left: 16px;
        width: 36px;
        padding: 8px 0;
        overflow: hidden;
        display: none;
        transition: width 0.35s var(--ease);
      }
      .ready:not(.playing) .beds {
        display: block;
      }
      .listing .beds {
        display: none !important;
      }
      .beds h3 {
        margin: 0;
        height: 0;
        overflow: hidden;
        padding: 0 14px;
        font: 600 12px var(--display);
        color: var(--text-2);
        opacity: 0;
        white-space: nowrap;
        transition: opacity 0.2s;
      }
      .beds .kind {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        width: 220px;
        border: 0;
        background: none;
        padding: 6px 14px 6px 0;
        cursor: pointer;
        text-align: left;
        color: var(--text);
        transition: background 0.15s;
      }
      .beds .kind .dot {
        justify-self: center;
        grid-row: span 2;
      }
      .beds .kind:hover {
        background: var(--hover);
      }
      .kn {
        font-size: 13.5px;
        font-weight: 500;
      }
      .kf {
        grid-column: 2;
        font-size: 11.5px;
        color: var(--text-3);
      }
      .kc {
        grid-row: 1 / span 2;
        grid-column: 3;
        font-size: 12px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .beds .kn,
      .kf,
      .kc {
        opacity: 0;
        white-space: nowrap;
        transition: opacity 0.2s;
      }
      .beds .kind[aria-pressed='false'] .dot {
        opacity: 0.3;
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.2);
      }
      .beds .kind[aria-pressed='false'] .kn,
      .beds .kind[aria-pressed='false'] .kf {
        text-decoration: line-through;
        text-decoration-color: rgba(255, 255, 255, 0.4);
      }
      .beds select,
      .beds .check {
        display: block;
        width: 192px;
        margin: 0 14px;
        height: 0;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .beds select {
        border: 1px solid var(--hair-soft);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        padding: 0 8px;
        font-size: 13px;
      }
      .beds select option {
        background: #23262f;
      }
      .check {
        font-size: 12.5px;
        color: var(--text-2);
        cursor: pointer;
        white-space: nowrap;
      }
      .check input {
        accent-color: #fff;
        vertical-align: -2px;
        margin: 0 6px 0 0;
      }
      .beds:hover,
      .beds:focus-within {
        width: 220px;
        background: var(--glass-strong);
      }
      .beds:hover h3,
      .beds:focus-within h3 {
        height: auto;
        padding: 4px 14px 6px;
      }
      .beds:hover select,
      .beds:focus-within select {
        height: 30px;
        margin-top: 8px;
      }
      .beds:hover .check,
      .beds:focus-within .check {
        height: auto;
        margin-top: 8px;
        margin-bottom: 4px;
      }
      .beds:hover :is(h3, select, .check, .kn, .kf, .kc),
      .beds:focus-within :is(h3, select, .check, .kn, .kf, .kc) {
        opacity: 1;
        transition-delay: 0.1s;
      }

      /* ---- the timeline ---------------------------------------------------------------------------------------- */
      #timeline {
        position: fixed;
        z-index: 3;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(360px, calc(100% - 240px));
        min-width: 220px;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 6px 14px 6px 6px;
        border-radius: 999px;
        opacity: 0.6;
        transition: opacity 0.3s;
      }
      .ready:not(.playing) #timeline:not([hidden]) {
        display: flex;
      }
      #timeline:hover,
      #timeline:focus-within,
      #timeline:has(#play[aria-pressed='true']) {
        opacity: 1;
      }
      #play {
        flex: none;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 0;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        cursor: pointer;
      }
      #play:hover {
        background: rgba(255, 255, 255, 0.26);
      }
      #play svg {
        width: 11px;
        height: 11px;
        fill: currentColor;
      }
      #play .pause,
      #play[aria-pressed='true'] .go {
        display: none;
      }
      #play[aria-pressed='true'] .pause {
        display: block;
      }
      .track {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        height: 28px;
      }
      #ticks {
        position: absolute;
        left: 6px;
        right: 6px;
        top: 50%;
        height: 6px;
        transform: translateY(-50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #timeline:hover #ticks {
        opacity: 1;
      }
      #ticks span {
        position: absolute;
        top: 0;
        width: 1px;
        height: 6px;
        background: rgba(255, 255, 255, 0.35);
      }
      #time {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        margin: 0;
        background: none;
        --p: 100%;
      }
      #time::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #fff var(--p), rgba(255, 255, 255, 0.22) var(--p));
      }
      #time::-moz-range-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #fff var(--p), rgba(255, 255, 255, 0.22) var(--p));
      }
      #time::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5.5px;
        border-radius: 50%;
        background: #fff;
        border: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        cursor: grab;
      }
      #time::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        border: 0;
      }
      #timeLabel {
        flex: none;
        font-size: 12.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* ---- the map ------------------------------------------------------------------------------------------------ */
      .mapbox {
        position: fixed;
        z-index: 3;
        right: 16px;
        bottom: 16px;
        padding: 4px;
        border-radius: 50%;
        display: none;
        opacity: 0.85;
        transition: opacity 0.3s;
      }
      .ready .mapbox {
        display: block;
      }
      .mapbox:hover {
        opacity: 1;
      }
      .playing .mapbox {
        pointer-events: none;
      }
      #map {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        cursor: pointer;
        transition: width 0.35s var(--ease), height 0.35s var(--ease);
      }
      .mapbox:hover #map {
        width: 176px;
        height: 176px;
      }

      /* ---- the card and the list ------------------------------------------------------------------------------------ */
      .card,
      .panel {
        position: fixed;
        z-index: 5;
        top: 64px;
        max-height: calc(100% - 150px);
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        background: var(--glass-strong);
        border-radius: 18px;
      }
      .card {
        right: 16px;
        width: min(380px, calc(100% - 32px));
        padding: 20px 20px 16px;
        display: grid;
        gap: 12px;
        animation: rise 0.35s var(--ease);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.99);
        }
      }
      .panel {
        left: 16px;
        width: min(330px, calc(100% - 32px));
        padding: 8px;
      }
      .close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-2);
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding-right: 34px;
      }
      .pill {
        font-size: 11.5px;
        font-weight: 500;
        padding: 2px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-2);
        text-transform: capitalize;
      }
      .pill.kind {
        color: #15161c;
        font-weight: 600;
      }
      .pill.pinned,
      .pill.warn {
        color: var(--warn);
        background: rgba(255, 210, 138, 0.14);
      }
      .pill.bad {
        color: var(--bad);
        background: rgba(255, 154, 168, 0.14);
      }
      .card h2 {
        margin: 0;
        font: 600 21px/1.25 var(--display);
        letter-spacing: -0.005em;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      .sub {
        margin: -6px 0 0;
        font-size: 12px;
        color: var(--text-3);
      }
      .content {
        margin: 0;
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--text-2);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .note {
        padding: 9px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        font-size: 13.5px;
        color: var(--text-2);
      }
      .note b,
      .rel h3,
      .panel h3 {
        display: block;
        margin: 0 0 3px;
        font: 600 11.5px var(--display);
        color: var(--text);
      }
      .rel {
        display: grid;
        gap: 6px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 100%;
        padding: 4px 11px 4px 9px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s;
      }
      .chip:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      details summary {
        cursor: pointer;
        font-size: 12.5px;
        color: var(--text-3);
      }
      details summary:hover {
        color: var(--text-2);
      }
      .hist {
        display: grid;
        gap: 8px;
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--text-2);
      }
      .hist div {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px;
      }
      .hist .r {
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .hist .x {
        color: var(--text-3);
      }
      .panel h3 {
        margin: 12px 10px 4px;
        color: var(--text-3);
      }
      .panel h3:first-child {
        margin-top: 6px;
      }
      .panel .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        font-size: 13.5px;
        text-align: left;
        cursor: pointer;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .panel .item:hover {
        background: var(--hover);
      }
      .panel .item.off {
        color: var(--text-3);
        text-decoration: line-through;
        text-decoration-color: rgba(255, 255, 255, 0.3);
      }
      .panel .none {
        margin: 12px 10px;
        color: var(--text-3);
      }

      /* ---- names over the garden --------------------------------------------------------------------------------------- */
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 2;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -100%);
        white-space: nowrap;
        max-width: 60vw;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--glass-strong);
        border: 1px solid var(--hair-soft);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .label.bed {
        transform: translate(-50%, -50%);
        font: 600 12.5px var(--display);
        padding: 0;
        background: none;
        border: 0;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        text-shadow: var(--shade);
      }

      @media (max-width: 760px) {
        .brand h1 {
          font-size: 13px;
        }
        #timeline {
          width: calc(100% - 150px);
          left: 16px;
          transform: none;
        }
        #map {
          width: 80px;
          height: 80px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="A painted hill to walk down. A path winds from today back to the first record, with one tall flower for each record beside it; the List button offers the same records as text."></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="aim" aria-hidden="true"></div>
    <div id="hint" hidden>E or click to read</div>
    <div id="era" aria-live="off"></div>
    <header class="bar">
      <div class="brand glass"><span class="mark" aria-hidden="true"></span><h1>Memory Garden</h1><span class="badge" id="count">Read-only</span></div>
      <span class="spacer"></span>
      <label class="find glass"><span hidden>Search the garden</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/><path d="M10.5 6.8v1.4M10.5 12.8v1.4M6.8 10.5h1.4M12.8 10.5h1.4" stroke-width="1"/></svg><input id="q" type="search" placeholder="Search the garden" autocomplete="off" spellcheck="false" /><kbd>/</kbd><span id="found" hidden></span></label>
      <button class="btn glass" id="listBtn" aria-controls="list" title="Every record (L)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 4.5 6 6 4.5 7.5 3 6zM4.5 10.5 6 12l-1.5 1.5L3 12zM4.5 16.5 6 18l-1.5 1.5L3 18z" fill="currentColor" stroke="none"/></svg><span hidden>Records</span></button>
    </header>
    <aside class="beds glass" aria-label="The beds: show or set aside each kind">
      <h3>Kinds</h3>
      <div id="legend"></div>
      <select id="harness" aria-label="Only records a harness wrote or revised"></select>
      <label class="check"><input type="checkbox" id="retired" /> Set aside retired records</label>
    </aside>
    <div id="timeline" class="glass">
      <button id="play" aria-pressed="false" aria-label="Replay the garden growing"><svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
      <div class="track"><div id="ticks"></div><input id="time" type="range" min="0" max="1000" value="1000" aria-label="The garden as it stood on a day" /></div>
      <span id="timeLabel">Today</span>
    </div>
    <div class="mapbox glass"><canvas id="map" aria-label="Map of the garden: click a flower's dot to walk to it"></canvas></div>
    <aside class="card glass" id="card" hidden aria-live="polite"></aside>
    <aside class="panel glass" id="list" hidden aria-label="All records">
      <div id="items"></div>
    </aside>
    <div id="start">
      <div>
        <b>Click to walk</b>
        <span>W A S D to walk · E to read a flower · / to search</span>
      </div>
    </div>
    <div id="note"></div>
    <div id="loading"><span>Memory Garden</span><div class="sigil" aria-hidden="true"></div></div>
    <noscript><div id="loading">The garden needs JavaScript to draw. Nothing leaves this machine.</div></noscript>
    <script type="module" src="./src/valley/main.js"></script>
  </body>
</html>
