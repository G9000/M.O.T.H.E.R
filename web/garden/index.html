<!doctype html>
<!-- The memory garden: served only by `mother garden explore`, on this machine, with every file embedded in the executable. The valley is Patch's painted valley (MIT code, CC0 art; see LICENCE-NOTES.md). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Memory Garden</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --glass: rgba(22, 43, 38, .92);
        --glass-strong: #192f2b;
        --hair: #657264;
        --hair-soft: #43574d;
        --hover: #314a40;
        --text: #faf5e7;
        --text-2: #d8dfd2;
        --text-3: #b5c2b4;
        --brass: #dfc592;
        --warn: #ffda9c;
        --bad: #ffb2bc;
        --face: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        --display: Georgia, 'Times New Roman', serif;
        --mono: ui-monospace, 'Cascadia Mono', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
        --shade: 0 1px 6px #12261f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9db7d4;
        color: var(--text);
        font: 14px/1.5 var(--face);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 1.5px solid rgba(255, 255, 255, 0.9);
        outline-offset: 2px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      [hidden] {
        display: none !important;
      }
      .glass {
        background: var(--glass);
        border: 1px solid var(--hair);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(10, 14, 30, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(22px) saturate(1.5);
        -webkit-backdrop-filter: blur(22px) saturate(1.5);
      }
      .ico {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dot {
        width: 8px;
        height: 8px;
        flex: none;
        display: inline-block;
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.35);
      }

      /* ---- the curtain, and the words before you walk --------------------------------------------------------- */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: grid;
        justify-items: start;
        align-content: end;
        gap: 10px;
        padding: clamp(28px, 7vw, 104px);
        isolation: isolate;
        text-align: left;
        background: linear-gradient(0deg, #0e211eed, transparent 61%),
          url('/glasshouse-pool.jpg') 65% center / cover, #1b332e;
      }
      .plate { position: absolute; pointer-events: none; }
      #loadingPlate { top: 0; right: 0; width: min(41vw, 530px); height: auto; z-index: -1; }
      #loading h2 { margin: 0; font: 400 clamp(40px, 7vw, 76px)/1.12 var(--display); }
      #loadStage { max-width: 40ch; color: var(--text-2); }
      #loadProgress { appearance: none; width: 156px; height: 3px; border: none; margin-top: 12px; background: var(--hair-soft); accent-color: var(--brass); }
      #loadProgress::-webkit-progress-bar { background: var(--hair-soft); }
      #loadProgress::-webkit-progress-value { background: var(--brass); }
      #loadProgress::-moz-progress-bar { background: var(--brass); }
      #start {
        position: fixed;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        justify-items: center;
        gap: 8px;
        pointer-events: none;
      }
      .ready:not(.playing, .listing) #start { display: grid; }
      body:has(#card:not([hidden]), #viewer:not([hidden])) #start { display: none; }
      #walkBtn {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 11px 20px; border-radius: 30px;
        border: 1px solid #f6e7c7; background: #f0dfba; color: #213c33;
        font: 600 15px var(--face); white-space: nowrap;
        box-shadow: 0 3px 18px #17251d50; cursor: pointer; pointer-events: auto;
      }
      #walkBtn:hover { background: #fff1ce; }
      .start-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
      #lensBtn, #treeBtn { pointer-events: auto; cursor: pointer; border: 1px solid var(--hair); border-radius: 24px;
        padding: 11px 16px; font: 600 14px var(--face); color: var(--text); background: var(--glass-strong); }
      #atlas [data-caption] { margin: 6px 0 0; color: var(--text); text-shadow: 0 1px 5px #14261e; }
      #atlas-title { text-transform: capitalize; }
      #start small { color: var(--text); background: var(--glass); padding: 3px 10px; border-radius: 5px; white-space: nowrap; }
      #note {
        position: fixed;
        top: 12vh;
        left: 0;
        right: 0;
        text-align: center;
        font: 600 18px var(--display);
        text-shadow: var(--shade);
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #note.on {
        opacity: 1;
        transition: opacity 0.15s;
      }
      #aim {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        display: none;
      }
      .playing #aim {
        display: block;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: calc(50% + 22px);
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        pointer-events: none;
      }
      body:not(.playing) #hint {
        display: none;
      }
      #era {
        position: fixed;
        left: 20px;
        bottom: 20px;
        font: 600 13px var(--display);
        text-shadow: var(--shade);
        pointer-events: none;
      }

      /* ---- the header ---------------------------------------------------------------------------------------- */
      .bar {
        position: fixed;
        z-index: 4;
        top: 0;
        left: 0;
        right: 0;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        pointer-events: none;
      }
      .ready .bar {
        display: flex;
      }
      .bar > * {
        pointer-events: auto;
      }
      .brand {
        display: grid; grid-template-columns: auto 1fr; align-items: center;
        gap: 0 12px; padding: 9px 19px 9px 13px; border-radius: 12px;
      }
      .mark { grid-row: span 2; display: grid; place-items: center; width: 34px; height: 38px; color: var(--brass); }
      .mark svg { width: 32px; height: 36px; }
      .brand h1 { margin: 0; font: 400 24px/1 var(--display); white-space: nowrap; }
      .badge { margin-top: 4px; font: 10px/1.2 var(--face); letter-spacing: .055em; color: var(--text-2); }
      .spacer { flex: 1; pointer-events: none; }
      .find {
        position: relative; display: flex; align-items: center; gap: 8px;
        width: clamp(150px, 19vw, 280px); height: 40px;
        padding: 0 12px; border-radius: 9px;
      }
      .find input { flex: 1; min-width: 0; width: 100%; border: 0; color: inherit; background: none; outline: none; }
      .find:focus-within { outline: 2px solid var(--brass); }
      .find input::placeholder { color: var(--text-2); }
      .find kbd { border: 1px solid var(--hair); padding: 0 4px; border-radius: 3px; }
      #found {
        position: absolute;
        top: 44px;
        right: 0;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 500;
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--glass-strong);
        border: 1px solid var(--hair-soft);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .btn {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn:hover {
        background: var(--glass-strong);
      }
      kbd {
        font: 11px var(--mono);
        color: var(--text-3);
      }

      .bar .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; height: 40px; width: auto; min-width: 40px; padding: 0 12px; border-radius: 9px; }
      .bar #pathBtn { background: #eadab9; color: #263c32; border-color: #f3e7c8; }
      .bar #pathBtn:hover { background: #fff0ce; }
      .playing .bar { display: none; }
      .beds {
        position: fixed; z-index: 4; top: 82px; left: 16px;
        border-radius: 10px; display: none; max-height: calc(100% - 160px); overflow: auto;
      }
      .ready:not(.playing, .listing) .beds { display: block; }
      .beds summary { display: flex; align-items: center; gap: 9px; padding: 9px 13px; cursor: pointer; }
      .beds summary::-webkit-details-marker { display: none; }
      .beds summary::after { content: '⌄'; margin-left: auto; color: var(--brass); }
      .beds[open] { width: min(238px, calc(100% - 32px)); }
      .beds[open] summary { border-bottom: 1px solid var(--hair-soft); }
      .beds[open] summary::after { transform: rotate(180deg); }
      .beds .kind {
        display: grid; grid-template-columns: 22px 1fr auto; align-items: center;
        width: 100%; padding: 6px 14px; border: 0; background: none; text-align: left; cursor: pointer;
      }
      .beds .kind:hover { background: var(--hover); }
      .kn { font-size: 14px; }
      .kc { font: 12px var(--mono); color: var(--brass); }
      .beds .kind[aria-pressed='false'] { opacity: .65; }
      .beds .kind[aria-pressed='false'] .kn { text-decoration: line-through; }
      .beds select { width: calc(100% - 24px); margin: 8px 12px; padding: 5px; background: var(--glass-strong); border: 1px solid var(--hair); border-radius: 6px; }
      .beds .check { display: block; margin: 0 12px 14px; }
      .check { font-size: 13px; color: var(--text-2); cursor: pointer; }
      .check input { accent-color: var(--brass); vertical-align: -2px; }
      /* ---- the timeline ---------------------------------------------------------------------------------------- */
      #timeline {
        position: fixed;
        z-index: 3;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(360px, calc(100% - 240px));
        min-width: 220px;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 6px 14px 6px 6px;
        border-radius: 999px;
        opacity: 1;
        transition: opacity 0.3s;
      }
      .ready:not(.playing) #timeline:not([hidden]) {
        display: flex;
      }
      #timeline:hover,
      #timeline:focus-within,
      #timeline:has(#play[aria-pressed='true']) {
        opacity: 1;
      }
      #play {
        flex: none;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 0;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        cursor: pointer;
      }
      #play:hover {
        background: rgba(255, 255, 255, 0.26);
      }
      #play svg {
        width: 11px;
        height: 11px;
        fill: currentColor;
      }
      #play .pause,
      #play[aria-pressed='true'] .go {
        display: none;
      }
      #play[aria-pressed='true'] .pause {
        display: block;
      }
      .track {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        height: 28px;
      }
      #ticks {
        position: absolute;
        left: 6px;
        right: 6px;
        top: 50%;
        height: 6px;
        transform: translateY(-50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #timeline:hover #ticks {
        opacity: 1;
      }
      #ticks span {
        position: absolute;
        top: 0;
        width: 1px;
        height: 6px;
        background: rgba(255, 255, 255, 0.35);
      }
      #time {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        margin: 0;
        background: none;
        --p: 100%;
      }
      #time::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #fff var(--p), rgba(255, 255, 255, 0.22) var(--p));
      }
      #time::-moz-range-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #fff var(--p), rgba(255, 255, 255, 0.22) var(--p));
      }
      #time::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5.5px;
        border-radius: 50%;
        background: #fff;
        border: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        cursor: grab;
      }
      #time::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        border: 0;
      }
      #timeLabel {
        flex: none;
        font-size: 12.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* ---- the map ------------------------------------------------------------------------------------------------ */
      .mapbox {
        position: fixed;
        z-index: 3;
        right: 16px;
        bottom: 16px;
        padding: 4px;
        border-radius: 50%;
        display: none;
        opacity: 0.85;
        transition: opacity 0.3s;
      }
      .ready .mapbox {
        display: grid;
        justify-items: center;
        border-radius: 18px;
      }
      .mapbox:hover {
        opacity: 1;
      }
      .playing .mapbox {
        pointer-events: none;
      }
      #map {
        display: block;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        cursor: pointer;
        transition: width 0.35s var(--ease), height 0.35s var(--ease);
      }
      .mapbox:hover #map {
        width: 176px;
        height: 176px;
      }

      /* ---- the card and the list ------------------------------------------------------------------------------------ */
      .card,
      .panel {
        position: fixed;
        z-index: 5;
        top: 64px;
        max-height: calc(100% - 150px);
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        background: var(--glass-strong);
        border-radius: 18px;
      }
      .card {
        right: 16px;
        width: min(380px, calc(100% - 32px));
        padding: 20px 20px 16px;
        display: grid;
        gap: 12px;
        animation: rise 0.35s var(--ease);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.99);
        }
      }
      .panel {
        left: 16px;
        width: min(330px, calc(100% - 32px));
        padding: 8px;
      }
      .close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-2);
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding-right: 34px;
      }
      .pill {
        font-size: 11.5px;
        font-weight: 500;
        padding: 2px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-2);
        text-transform: capitalize;
      }
      .pill.kind {
        color: #15161c;
        font-weight: 600;
      }
      .pill.pinned,
      .pill.warn {
        color: var(--warn);
        background: rgba(255, 210, 138, 0.14);
      }
      .pill.bad {
        color: var(--bad);
        background: rgba(255, 154, 168, 0.14);
      }
      .card h2 {
        margin: 0;
        font: 600 21px/1.25 var(--display);
        letter-spacing: -0.005em;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      .sub {
        margin: -6px 0 0;
        font-size: 12px;
        color: var(--text-3);
      }
      .content {
        margin: 0;
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--text-2);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .note {
        padding: 9px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        font-size: 13.5px;
        color: var(--text-2);
      }
      .note b,
      .rel h3,
      .panel h3 {
        display: block;
        margin: 0 0 3px;
        font: 600 11.5px var(--display);
        color: var(--text);
      }
      .rel {
        display: grid;
        gap: 6px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 100%;
        padding: 4px 11px 4px 9px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s;
      }
      .chip:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      details summary {
        cursor: pointer;
        font-size: 12.5px;
        color: var(--text-3);
      }
      details summary:hover {
        color: var(--text-2);
      }
      .hist {
        display: grid;
        gap: 8px;
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--text-2);
      }
      .hist div {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px;
      }
      .hist .r {
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .hist .x {
        color: var(--text-3);
      }
      .panel h3 {
        margin: 12px 10px 4px;
        color: var(--text-3);
      }
      .panel h3:first-child {
        margin-top: 6px;
      }
      .panel .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        font-size: 13.5px;
        text-align: left;
        cursor: pointer;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .panel .item:hover {
        background: var(--hover);
      }
      .panel .item.off {
        color: var(--text-3);
        text-decoration: line-through;
        text-decoration-color: rgba(255, 255, 255, 0.3);
      }
      .panel .none {
        margin: 12px 10px;
        color: var(--text-3);
      }

      /* ---- names over the garden --------------------------------------------------------------------------------------- */
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 2;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -100%);
        white-space: nowrap;
        max-width: 60vw;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--glass-strong);
        border: 1px solid var(--hair-soft);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .label.bed {
        transform: translate(-50%, -50%);
        font: 600 12.5px var(--display);
        padding: 0;
        background: none;
        border: 0;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        text-shadow: var(--shade);
      }

      @media (max-width: 760px) {
        .brand h1 {
          font-size: 13px;
        }
        #timeline {
          width: calc(100% - 150px);
          left: 16px;
          transform: none;
        }
        #map {
          width: 80px;
          height: 80px;
        }
      }
      /* ---- the Reading Path: every record as text, over the garden or as the whole page -------------------------- */
      .path {
        position: fixed;
        inset: 0;
        z-index: 7;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 28px 16px 64px;
        background: #172b26;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        animation: fade 0.25s var(--ease);
      }
      .rpwrap {
        display: grid;
        gap: 16px;
        width: min(920px, 100%);
        margin: 0 auto;
      }
      .rptop {
        position: relative; isolation: isolate; overflow: hidden; min-height: clamp(190px, 26vw, 286px); padding: clamp(18px, 4vw, 38px);
        border: 1px solid var(--hair); border-radius: 14px;
        background: linear-gradient(90deg, #172c26e8 0%, #172c2670 40%, transparent 71%),
          url('/glasshouse-pool.jpg') 68% 54% / cover, #243f35;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .rptop .plate { right: 0; top: 0; width: min(28%, 220px); height: auto; z-index: -1; }
      .rpkicker {
        margin: 0 0 2px;
        font-size: 13px;
        color: var(--text-3);
      }
      .rptop h1 {
        margin: 0;
        font: 400 clamp(34px, 5vw, 56px) / 1.15 var(--display);
      }
      .rptop h1:focus {
        outline: none;
      }
      .rpback,
      .rpseg button,
      .rpkinds button {
        padding: 6px 14px;
        border: 1px solid var(--hair-soft);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 14px;
        color: var(--text-2);
        cursor: pointer;
      }
      .rpback:hover,
      .rpseg button:hover,
      .rpkinds button:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }
      .rptop .rpback { background: #213b32; }

  </head>
  <body>
    <canvas id="view" aria-label="A painted hill with flowers and stones marking records along a path through time. Open List to read the records as text."></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="aim" aria-hidden="true"></div>
    <div id="hint" hidden>E or click to read</div>
    <div id="era" aria-live="off"></div>
    <header class="bar">
      <div class="brand glass"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 38" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 35V17a14 14 0 0 1 28 0v18zM5 35V17a11 11 0 0 1 22 0v18M16 33V14m0 13c-6 0-8-4-8-7 5 0 8 3 8 7zm0-5c5-1 8-5 8-9-5 1-8 5-8 9zm0-4c-4-3-4-7 0-11 4 4 4 8 0 11z"/></svg></span><h1>Memory Garden</h1><span class="badge" id="count">Read-only</span></div>
      <span class="spacer"></span>
      <label class="find glass"><span hidden>Search the garden</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/><path d="M10.5 6.8v1.4M10.5 12.8v1.4M6.8 10.5h1.4M12.8 10.5h1.4" stroke-width="1"/></svg><input id="q" type="search" placeholder="Search the garden" autocomplete="off" spellcheck="false" /><kbd>/</kbd><span id="found" hidden></span></label>
      <button class="btn glass off" id="soundBtn" title="Sound (M)" aria-pressed="false" aria-label="Sound is off"><svg class="ico on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><svg class="ico mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg></button>
      <button class="btn glass" aria-label="Reading Path" id="pathBtn" aria-controls="path" title="Reading Path: every record as text"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h9.5a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H5z"/><path d="M8 8.5h6M8 12h6"/></svg><span>Reading Path</span></button>
      <button class="btn glass" aria-label="Records" id="listBtn" aria-controls="list" title="Every record (L)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 4.5 6 6 4.5 7.5 3 6zM4.5 10.5 6 12l-1.5 1.5L3 12zM4.5 16.5 6 18l-1.5 1.5L3 18z" fill="currentColor" stroke="none"/></svg><span>Records</span></button>
    </header>
    <details class="beds glass"><summary><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h10m4 0h4M3 17h4m4 0h10"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Filters</summary>
      <div id="legend"></div>
      <select id="harness" aria-label="Only records a harness wrote or revised"></select>
      <label class="check"><input type="checkbox" id="retired" /> Set aside retired records</label>
    </details>
    <div id="timeline" class="glass">
      <button id="play" aria-pressed="false" aria-label="Replay the garden growing"><svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
      <div class="track"><div id="ticks"></div><input id="time" type="range" min="0" max="1000" value="1000" aria-label="The garden as it stood on a day" /></div>
      <span id="timeLabel">Today</span>
    </div>
    <div class="mapbox glass"><button id="atlasBtn" type="button" aria-haspopup="dialog" aria-controls="atlas">Garden atlas</button><canvas id="map" aria-label="Garden map. Click a record's dot to walk to it."></canvas></div>
    <dialog id="atlas" aria-labelledby="atlas-title">
      <header class="atlas-head"><div><h2 id="atlas-title">Garden atlas</h2><p data-caption hidden aria-live="polite"></p></div><button type="button" data-return>Back to walk</button></header>
      <div class="atlas-foot">
        <div class="atlas-stops" role="group" aria-label="Viewpoints"></div>
        <div class="atlas-tools" data-specimens hidden role="group" aria-label="Specimen lens">
          <button type="button" data-step="-1">Previous</button><button type="button" data-step="1">Next</button>
          <button type="button" data-zoom>Whole specimen</button>
        </div>
        <div class="atlas-tools">
          <select aria-label="Time of day"></select>
          <button type="button" data-left aria-label="Rotate view left" title="Rotate left">&#8630;</button>
          <button type="button" data-right aria-label="Rotate view right" title="Rotate right">&#8631;</button>
          <button type="button" data-travel>Walk here</button>
        </div>
      </div>
    </dialog>
    <aside class="card glass" id="card" hidden aria-live="polite"></aside>
    <main class="path" id="path" hidden aria-labelledby="rp-title"></main>
    <div class="reader" id="reader" hidden></div>
    <div class="viewer" id="viewer" hidden role="dialog" aria-label="A photo or recording from the garden"></div>
    <aside class="panel glass" id="list" hidden aria-label="All records">
      <div id="items"></div>
    </aside>
    <div id="start">
      <div class="start-actions"><button id="walkBtn" type="button">Walk the garden <span aria-hidden="true">→</span></button><button id="lensBtn" type="button" aria-haspopup="dialog" aria-controls="atlas" hidden>Specimen lens</button><button id="treeBtn" type="button" aria-haspopup="dialog" aria-controls="atlas">Blossom tree</button></div>
      <small>WASD to move · E to read · Esc to pause</small>
    </div>
    <div id="note"></div>
    <div id="loading"><canvas class="plate" id="loadingPlate" aria-hidden="true"></canvas><h2>Memory Garden</h2><span id="loadStage" role="status">Opening the garden</span><progress id="loadProgress" max="1" value="0" aria-label="Preparing the garden"></progress></div>
    <noscript><div id="loading">The garden needs JavaScript to draw. Nothing leaves this machine.</div></noscript>
    <script type="module" src="./src/valley/main.js"></script>
  </body>
</html>
