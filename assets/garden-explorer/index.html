<!doctype html>
<!-- The memory garden: served only by `mother garden explore`, on this machine, with every file embedded in the executable. The valley is Patch's painted valley (MIT code, CC0 art; see LICENCE-NOTES.md). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Memory Garden</title>
    <link rel="icon" href="data:," />
    <style>:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;--glass:#ffffffd6;--line:#28324633;--fg:#1f2a33;--muted:#4c5a66;--faint:#66737f;--accent:#2f6fb0;--gold:#8a5200;--bad:#b0304a;--display:Georgia, "Iowan Old Style", "Times New Roman", serif;--body:"Segoe UI", system-ui, sans-serif;--mono:ui-monospace, "Cascadia Mono", Menlo, monospace}*{box-sizing:border-box}html,body{height:100%;color:var(--fg);font:15px/1.5 var(--body);background:#dfeaf0;margin:0;overflow:hidden}button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}canvas{width:100%;height:100%;display:block}#loading,#start{font-family:var(--display);letter-spacing:.06em;pointer-events:none;-webkit-user-select:none;user-select:none;place-items:center;display:grid;position:fixed;inset:0}#loading{text-align:center;z-index:9;background:#dfeaf0;padding:24px}#start{color:#fff;text-shadow:0 1px 10px #14325099;align-content:end;padding-bottom:9vh;display:none}#start b{text-align:center;font-size:19px;font-weight:400;display:block}#start span{opacity:.9;text-align:center;margin-top:4px;font-size:13px;display:block}.ready:not(.playing) #start{display:grid}#note{text-align:center;font:19px var(--display);letter-spacing:.06em;color:#fff;text-shadow:0 1px 10px #1432508c;opacity:0;pointer-events:none;transition:opacity .6s;position:fixed;top:11vh;left:0;right:0}#note.on{opacity:1;transition:opacity .15s}#aim{pointer-events:none;background:#ffffffd9;border-radius:50%;width:6px;height:6px;margin:-3px;display:none;position:fixed;top:50%;left:50%;box-shadow:0 0 0 1px #14283c73}.playing #aim{display:block}#hint{text-align:center;color:#fff;font:15px var(--display);letter-spacing:.05em;text-shadow:0 1px 8px #143250b3;pointer-events:none;position:fixed;bottom:16vh;left:0;right:0}#era{color:#fff;font:italic 600 20px var(--display);letter-spacing:.04em;text-shadow:0 1px 10px #143250b3;pointer-events:none;position:fixed;bottom:16px;left:18px}body:not(.playing) #hint{display:none}.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px)saturate(1.2);backdrop-filter:blur(12px)saturate(1.2);border-radius:12px;box-shadow:0 8px 30px #1428462e}.bar{pointer-events:none;z-index:3;align-items:center;gap:12px;display:none;position:fixed;top:14px;left:16px;right:16px}.ready .bar{display:flex}.bar>*{pointer-events:auto}.brand{pointer-events:none;color:#fff;text-shadow:0 1px 10px #14325099;align-items:baseline;gap:10px;display:flex}.brand .acr{font:11px var(--mono);letter-spacing:.24em}.brand h1{font:italic 600 26px/1 var(--display);margin:0}.badge{color:var(--gold);pointer-events:none;background:#ffffffd1;border:1px solid #8a520073;border-radius:999px;padding:1px 9px;font-size:12px}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--glass);cursor:pointer;border-radius:10px;padding:6px 12px}.btn kbd{font:11px var(--mono);color:var(--faint);margin-left:6px}#labels{pointer-events:none;z-index:2;position:fixed;inset:0;overflow:hidden}.label{white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--line);background:#ffffffe6;border-radius:999px;max-width:60vw;padding:2px 9px;font-size:13px;position:absolute;overflow:hidden;transform:translate(-50%,-100%);box-shadow:0 2px 10px #14284633}.label.bed{font:italic 600 15px var(--display);background:#ffffffc7;align-items:center;gap:6px;display:inline-flex}.label[hidden]{display:none}.dot{border-radius:50%;flex:none;width:8px;height:8px;display:inline-block;box-shadow:0 0 0 1px #1e28374d}.card,.panel{z-index:4;max-height:calc(100% - 90px);position:fixed;top:62px;overflow:auto}.card{gap:12px;width:min(380px,100% - 32px);padding:18px;display:grid;right:16px}.panel{width:min(330px,100% - 32px);padding:14px;left:16px}.card[hidden],.panel[hidden]{display:none}.card .close{cursor:pointer;width:32px;height:32px;color:var(--muted);background:0 0;border:0;border-radius:8px;font-size:20px;line-height:1;position:absolute;top:10px;right:10px}.pills{flex-wrap:wrap;gap:6px;padding-right:28px;display:flex}.pill{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:1px 9px;font-size:12px}.pill.kind{color:#14181c;font-weight:600}.pill.pinned,.pill.warn{color:var(--gold);border-color:#8a520080}.pill.bad{color:var(--bad);border-color:#b0304a80}.card h2{font:600 26px/1.15 var(--display);text-wrap:balance;overflow-wrap:anywhere;margin:0}.sub{font:12px var(--mono);color:var(--faint);margin:-6px 0 0}.content{overflow-wrap:anywhere;white-space:pre-wrap;margin:0}.note{background:#2f6fb01a;border-radius:10px;padding:9px 11px;font-size:14px}.note b,.rel h3,.panel h3{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0;display:block}.rel{gap:6px;display:grid}.chips{flex-wrap:wrap;gap:6px;display:flex}.chip{border:1px solid var(--line);cursor:pointer;text-overflow:ellipsis;white-space:nowrap;background:#ffffffbf;border-radius:999px;align-items:center;gap:6px;max-width:100%;padding:3px 10px;font-size:13px;display:inline-flex;overflow:hidden}.chip:hover{border-color:var(--accent)}details summary{cursor:pointer;color:var(--muted);font-size:13.5px}.hist{gap:6px;margin-top:8px;font-size:13px;display:grid}.hist div{grid-template-columns:46px minmax(0,1fr);gap:8px;display:grid}.hist .r{font-family:var(--mono);color:var(--faint)}.hist .x{color:var(--muted)}.panel input{border:1px solid var(--line);background:#fffc;border-radius:8px;width:100%;padding:7px 10px}.panel h3{margin:12px 0 4px}.panel .item{cursor:pointer;text-align:left;background:0 0;border:0;border-radius:6px;align-items:center;gap:8px;width:100%;padding:4px;display:flex}.panel .item:hover{background:#2f6fb01f}.panel .item.off{color:var(--faint)}.panel .none{color:var(--muted);margin:12px 0 0}</style>
    <script type="module" crossorigin src="./assets/index.js"></script>
  </head>
  <body>
    <canvas id="view" aria-label="A painted hill to walk down. A path winds from today back to the first record, with one tall flower for each record beside it; the List button offers the same records as text."></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="aim" aria-hidden="true"></div>
    <div id="hint" hidden>E or click to read</div>
    <div id="era" aria-live="off"></div>
    <header class="bar">
      <div class="brand"><span class="acr">M.O.T.H.E.R</span><h1>Memory garden</h1></div>
      <span class="badge" id="count">Read-only</span>
      <span class="spacer"></span>
      <button class="btn" id="listBtn" aria-controls="list">List<kbd>L</kbd></button>
    </header>
    <aside class="card glass" id="card" hidden aria-live="polite"></aside>
    <aside class="panel glass" id="list" hidden aria-label="All records">
      <label><span hidden>Search the garden</span><input id="q" type="search" placeholder="Search records" autocomplete="off" /></label>
      <div id="items"></div>
    </aside>
    <div id="start">
      <div>
        <b>Click to walk</b>
        <span>W A S D · Shift to run · the path leads back through time · look at a flower and press E to read it · L for the list · T for time of day</span>
      </div>
    </div>
    <div id="note"></div>
    <div id="loading"><span>Memory garden</span></div>
    <noscript><div id="loading">The garden needs JavaScript to draw. Nothing leaves this machine.</div></noscript>
  </body>
</html>
