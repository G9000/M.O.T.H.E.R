[package]
name = "garden-store"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.90"

[workspace]

[features]
default = []
sqlite-baseline = ["dep:rusqlite"]

[dependencies]
redb = "=4.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
